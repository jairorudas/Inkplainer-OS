<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inkplainer Arrow Pack</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1a1a1a;--muted:#777;--line:#e2e0d8;--accent:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--card:#222;--text:#eee;--muted:#999;--line:#333;--accent:#6ea0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
h1{font-size:16px;margin:0 8px 0 0}
label{display:flex;align-items:center;gap:6px;color:var(--muted)}
input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}
select,button{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent)}
.swatches{display:flex;gap:4px}
.swatches i{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}
main{padding:16px;max-width:1200px;margin:auto}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card .art{width:100%;aspect-ratio:1;background:#fff;border-radius:6px}
.card .art svg{width:100%;height:100%;display:block;transition:transform .15s}
.card small{display:block;color:var(--muted);margin-top:4px;font-size:11px;overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Arrow Pack</h1>
  <label>Color <input type="color" id="color" value="#111111"></label>
  <div class="swatches" id="swatches"></div>
  <label>Rotate
    <select id="rot"><option value="0">→ 0°</option><option value="45">↘ 45°</option><option value="90">↓ 90°</option><option value="135">↙ 135°</option><option value="180">← 180°</option><option value="225">↖ 225°</option><option value="270">↑ 270°</option><option value="315">↗ 315°</option></select>
  </label>
  <label><input type="checkbox" id="flip"> Flip vertical</label>
  <button id="bgbtn">Dark preview bg</button>
  <span style="color:var(--muted)">Click an arrow → downloads the recolored SVG. Shift+click → copies the SVG code.</span>
</header>
<main id="main"></main>
<div id="toast"></div>
<script src="arrows-data.js"></script>
<script>
const $ = id => document.getElementById(id);
const darken = (hex, f = .55) => '#' + [1, 3, 5].map(i => Math.round(parseInt(hex.substr(i, 2), 16) * f).toString(16).padStart(2, '0')).join('');

// Builds the final SVG string; recolors and optionally rotates / flips (baked into the file).
function arrowSVG(tpl, color, rot = 0, flip = false) {
  let inner = tpl.replace(/%C%/g, color).replace(/%INK%/g, darken(color));
  if (rot || flip) {
    const t = `translate(100 100) rotate(${rot})${flip ? ' scale(1 -1)' : ''} translate(-100 -100)`;
    inner = `<g transform="${t}">${inner}</g>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 200 200">${inner}</svg>`;
}
window.arrowSVG = arrowSVG; // use in the app: arrowSVG(ARROW_PACK.marker.items.curve, '#e11d48', 90)

function render() {
  const color = $('color').value, rot = +$('rot').value, flip = $('flip').checked;
  const main = $('main'); main.innerHTML = '';
  for (const [style, pack] of Object.entries(ARROW_PACK)) {
    const h = document.createElement('h2'); h.textContent = pack.label; main.appendChild(h);
    const grid = document.createElement('div'); grid.className = 'grid'; main.appendChild(grid);
    for (const [name, tpl] of Object.entries(pack.items)) {
      const c = document.createElement('div'); c.className = 'card';
      c.innerHTML = `<div class="art">${arrowSVG(tpl, color, rot, flip)}</div><small>${style}-${name}</small>`;
      c.onclick = e => {
        const svg = arrowSVG(tpl, color, rot, flip);
        if (e.shiftKey) { navigator.clipboard.writeText(svg); toast('SVG code copied'); return; }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
        a.download = `${style}-${name}-${color.slice(1)}.svg`; a.click();
        toast('Downloaded ' + a.download);
      };
      grid.appendChild(c);
    }
  }
}
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1500); }

['#111111', '#e11d48', '#f97316', '#eab308', '#16a34a', '#0ea5e9', '#2563eb', '#9333ea', '#ec4899'].forEach(c => {
  const i = document.createElement('i'); i.style.background = c; i.onclick = () => { $('color').value = c; render(); };
  $('swatches').appendChild(i);
});
['color', 'rot', 'flip'].forEach(id => $(id).addEventListener('input', render));
let dark = false;
$('bgbtn').onclick = () => { dark = !dark; document.documentElement.style.setProperty('--art', dark ? '#222' : '#fff'); document.querySelectorAll('.art').forEach(a => a.style.background = dark ? '#222' : '#fff'); };
render();
</script>
</body>
</html>
